<text x="48" y="114" fill="#f472b6" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">ANALYSIS / 05</text>
<text x="45" y="194" fill="#f3f5fa" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">PacketStory</text>
<text x="48" y="247" fill="#e0e6ef" font-family="Arial, sans-serif" font-size="25">Packet captures, told as a story</text>
<text x="48" y="285" fill="#99a7bc" font-family="Arial, sans-serif" font-size="21">Who talked to whom, when, and what is worth a look. Every line cites its packets.</text>
