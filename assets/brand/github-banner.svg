<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">PacketStory — Packet captures, told as a story</title><desc id="desc">Turn a pcap into a readable timeline of what talked to what, with packet citations and notes on what is worth a look. By OBEOS.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
